[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xno-call-binding"
version = "0.1.0"
description = "Bind a Nano (XNO) payment to the call it paid for: stdlib only, no key; network only in the read-only node and price helpers (finality_facts, four_check, usd_quote), never at import."
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.urls]
Source = "https://github.com/dhyabi2/xno-call-binding"

[tool.setuptools]
py-modules = ["binding_options", "call_binding", "four_check", "presigned_send", "quote_service", "usd_quote", "finality_facts", "ap2_nano_mandate"]
